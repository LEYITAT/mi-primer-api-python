<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 405 - Camino Prohibido</title>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: #001f3f; 
            color: #e0f7fa; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(to bottom, #001f3f, #0b3d91); 
        }
        .container {
            background-color: rgba(0, 31, 63, 0.8); 
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 113, 188, 0.5); 
            padding: 40px;
            margin-top: 50px;
            margin-bottom: 50px;
            text-align: center;
            max-width: 800px;
            border: 1px solid #6dd5ed; 
        }
        h1 {
            color: #ff6b6b; 
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px #000000;
            animation: pulse 2s infinite alternate;
        }
        h2 {
            color: #91a8e8; 
            font-size: 2em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px #000000;
        }
        p {
            font-size: 1.2em;
            line-height: 1.7;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px #000000;
            color: #bbdefb; 
        }
        a {
            color: #b3e5fc; 
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
            transition: color 0.3s ease;
            text-shadow: 1px 1px 2px #000000;
        }
        a:hover {
            color: #e0f7fa; 
            text-decoration: underline;
        }
        .icon {
            font-size: 4em;
            margin-bottom: 10px;
            color: #ffcc00; 
            text-shadow: 2px 2px 5px rgba(255, 204, 0, 0.5);
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⛔</div>
        <h1>¡Error 405!</h1>
        <h2>Acceso Denegado</h2>
        <p>Has intentado abrir esta puerta con la llave equivocada (método HTTP).</p>
        <p>Los guardianes de este sendero solo permiten ciertos pases. Por favor, verifica el método correcto para acceder a este lugar mágico.</p>
        <p><a href="/">Volver al Bosque Encantado</a></p>
    </div>
</body>
</html>
